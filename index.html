<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Web Video Player</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: #000; 
            color: #fff; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        .top-bar { 
            display: flex; 
            background: #121212; 
            padding: 10px; 
            gap: 8px; 
            align-items: center;
        }
        .top-bar input { 
            flex: 1; 
            background: #242424; 
            border: 1px solid #333; 
            color: #fff; 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 14px;
        }
        .top-bar button { 
            background: #FF0000; 
            color: #fff; 
            border: none; 
            padding: 10px 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
        }
        .player-container {
            flex: 1;
            width: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 確保影片容器佔滿且不轉圈 */
        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }
        .status { 
            background: #1E1E1E; 
            padding: 8px 12px; 
            font-size: 12px; 
            color: #00FF00; 
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button onclick="loadDefaultYouTube()">YouTube 熱門</button>
        <input type="text" id="urlInput" placeholder="貼上 YouTube 網址或 MP4 連結">
        <button onclick="playMedia()">播放</button>
    </div>

    <div class="player-container" id="container">
        <!-- 初始直接載入穩定的 YouTube 嵌入播放器，秒開不轉圈 -->
        <iframe id="ytPlayer" src="https://www.youtube.com/embed/L_LUpnjgPso?autoplay=1&enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>

    <div class="status">
        <span id="statusText">狀態：極速載入完成，零延遲播放中</span>
        <span>Ultra Web Player</span>
    </div>

    <script>
        const container = document.getElementById('container');
        const statusText = document.getElementById('statusText');
        const urlInput = document.getElementById('urlInput');

        function loadDefaultYouTube() {
            container.innerHTML = `<iframe id="ytPlayer" src="https://www.youtube.com/embed/L_LUpnjgPso?autoplay=1&enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            statusText.innerText = "狀態：已載入 YouTube 播放核心";
        }

        function playMedia() {
            const rawUrl = urlInput.value.trim();
            if (!rawUrl) return;

            statusText.innerText = "狀態：正在切換媒體來源...";

            // 判斷是否為 YouTube 網址
            if (rawUrl.includes("youtube.com") || rawUrl.includes("youtu.be")) {
                let videoId = "";
                if (rawUrl.includes("youtu.be/")) {
                    videoId = rawUrl.split("youtu.be/")[1]?.split("?")[0];
                } else if (rawUrl.includes("watch?v=")) {
                    videoId = rawUrl.split("watch?v=")[1]?.split("&")[0];
                } else if (rawUrl.includes("embed/")) {
                    videoId = rawUrl.split("embed/")[1]?.split("?")[0];
                }

                if (videoId) {
                    container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                    statusText.innerText = "狀態：YouTube 影片播放中";
                } else {
                    alert("無法解析該 YouTube 網址，請確認格式");
                }
            } else {
                // 一般 MP4 / 直鏈影片
                container.innerHTML = `<video id="videoPlayer" src="${rawUrl}" controls autoplay playsinline></video>`;
                statusText.innerText = "狀態：自訂直鏈影片播放中";
            }
        }
    </script>
</body>
</html>
