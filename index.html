<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SmoothPlayer</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>
  <!-- 一打開就是 YouTube 模式 -->
  <div id="youtubeMode" class="screen">
    <div class="yt-header">
      <div class="yt-logo">SmoothPlayer</div>
      <input id="ytSearch" type="search" placeholder="搜尋或貼上 YouTube 網址..." />
    </div>

    <div id="ytPlayerWrap">
      <iframe id="ytFrame" 
              src="https://www.youtube-nocookie.com/embed?listType=search&list=熱門&autoplay=0&rel=0&modestbranding=1&playsinline=1"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
              referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>

    <div class="yt-bottom-bar">
      <button id="btnSwitchPlayer" class="yt-btn">切換自己的播放器（MP4/HLS）</button>
    </div>
  </div>

  <!-- 自己的原生播放器模式（給 MP4 / HLS 用） -->
  <div id="nativeMode" class="screen hidden">
    <div class="player-wrapper">
      <video id="video" playsinline webkit-playsinline></video>
      <div id="buffering" class="buffering hidden"><div class="spinner"></div></div>

      <div id="controls" class="controls">
        <div class="controls-top">
          <span id="netSpeed" class="net-speed"></span>
          <button id="btnQuality" class="ctrl-btn">畫質</button>
          <button id="btnSpeed" class="ctrl-btn">1.0x</button>
          <button id="btnLock" class="ctrl-btn">鎖定</button>
        </div>
        <div class="controls-center">
          <button id="btnRewind" class="ctrl-btn-round">⏪</button>
          <button id="btnPlayPause" class="ctrl-btn-round play-pause">▶</button>
          <button id="btnForward" class="ctrl-btn-round">⏩</button>
        </div>
        <div class="controls-bottom">
          <span id="currentTime">00:00</span>
          <input id="seekBar" type="range" min="0" max="1000" value="0" />
          <span id="duration">00:00</span>
          <button id="btnFullscreen" class="ctrl-btn">⛶</button>
        </div>
        <div id="statusMsg" class="status-msg hidden"></div>
      </div>
    </div>
    <button id="btnBackToYt" class="btn-back">← 返回 YouTube</button>
  </div>

  <script src="player.js"></script>
</body>
</html>
